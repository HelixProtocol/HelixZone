<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .error-title { font-family: Arial; font-size: 16px; font-weight: bold; }
            .error-desc { font-family: Arial; font-size: 12px; }
            .solution-step { font-family: 'Courier New'; font-size: 12px; fill: #1976d2; }
            .hover-text { font-family: Arial; font-size: 12px; fill: #ffffff; }
            
            /* Interactive States */
            .interactive-element:hover {
                filter: brightness(1.1);
                cursor: pointer;
            }
            .tooltip { opacity: 0; transition: opacity 0.3s; }
            .interactive-element:hover .tooltip { opacity: 1; }
            .solution-detail { opacity: 0; transition: opacity 0.3s; }
            .error-box:hover .solution-detail { opacity: 1; }
        </style>

        <!-- Error Box -->
        <g id="error-box">
            <rect width="360" height="280" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
            <rect width="360" height="40" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        </g>

        <!-- Solution Box -->
        <g id="solution-box">
            <rect width="320" height="180" rx="3" fill="#e8f5e9" stroke="#a5d6a7"/>
        </g>

        <!-- Tooltip -->
        <g id="tooltip">
            <rect width="200" height="120" rx="5" fill="#424242" opacity="0.9"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Interactive Error Recovery Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Click on errors to see detailed solutions and prevention tips
    </text>

    <!-- Startup Errors -->
    <g transform="translate(20,100)">
        <use href="#error-box"/>
        <text x="20" y="25" class="error-title">Startup Errors</text>
        
        <!-- Error Area -->
        <g transform="translate(20,50)" class="error-box interactive-element">
            <use href="#solution-box"/>
            <text x="20" y="30" class="error-desc">GPU Initialization Failed</text>
            <text x="20" y="50" class="error-desc" fill="#d32f2f">Error: CUDA device not found</text>
            
            <!-- Solution -->
            <g class="solution-detail">
                <rect x="10" y="70" width="300" height="100" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="20" y="90" class="solution-step">1. Check GPU drivers</text>
                <text x="20" y="110" class="solution-step">2. Verify CUDA installation</text>
                <text x="20" y="130" class="solution-step">3. Try CPU fallback mode</text>
                <text x="20" y="150" class="solution-step">4. Update graphics drivers</text>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">GPU Error Solutions</text>
                <text x="10" y="40" class="hover-text">• Check System Requirements</text>
                <text x="10" y="60" class="hover-text">• Update Drivers</text>
                <text x="10" y="80" class="hover-text">• Configure GPU Settings</text>
                <text x="10" y="100" class="hover-text">Press F1 for Help</text>
            </g>
        </g>
    </g>

    <!-- File Operation Errors -->
    <g transform="translate(400,100)">
        <use href="#error-box"/>
        <text x="20" y="25" class="error-title">File Operation Errors</text>
        
        <!-- Error Area -->
        <g transform="translate(20,50)" class="error-box interactive-element">
            <use href="#solution-box"/>
            <text x="20" y="30" class="error-desc">File Save Failed</text>
            <text x="20" y="50" class="error-desc" fill="#d32f2f">Error: Access Denied</text>
            
            <!-- Solution -->
            <g class="solution-detail">
                <rect x="10" y="70" width="300" height="100" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="20" y="90" class="solution-step">1. Check permissions</text>
                <text x="20" y="110" class="solution-step">2. Free up disk space</text>
                <text x="20" y="130" class="solution-step">3. Try different location</text>
                <text x="20" y="150" class="solution-step">4. Close other programs</text>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">File Access Solutions</text>
                <text x="10" y="40" class="hover-text">• Check File Permissions</text>
                <text x="10" y="60" class="hover-text">• Verify Disk Space</text>
                <text x="10" y="80" class="hover-text">• Try Save As...</text>
                <text x="10" y="100" class="hover-text">Ctrl+Shift+S for Save As</text>
            </g>
        </g>
    </g>

    <!-- Memory Errors -->
    <g transform="translate(780,100)">
        <use href="#error-box"/>
        <text x="20" y="25" class="error-title">Memory Errors</text>
        
        <!-- Error Area -->
        <g transform="translate(20,50)" class="error-box interactive-element">
            <use href="#solution-box"/>
            <text x="20" y="30" class="error-desc">Insufficient Memory</text>
            <text x="20" y="50" class="error-desc" fill="#d32f2f">Error: Out of Memory</text>
            
            <!-- Solution -->
            <g class="solution-detail">
                <rect x="10" y="70" width="300" height="100" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="20" y="90" class="solution-step">1. Close unused files</text>
                <text x="20" y="110" class="solution-step">2. Reduce history states</text>
                <text x="20" y="130" class="solution-step">3. Clear cache</text>
                <text x="20" y="150" class="solution-step">4. Optimize performance</text>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Memory Management</text>
                <text x="10" y="40" class="hover-text">• Optimize Workspace</text>
                <text x="10" y="60" class="hover-text">• Reduce File Size</text>
                <text x="10" y="80" class="hover-text">• Clear Temp Files</text>
                <text x="10" y="100" class="hover-text">Ctrl+Alt+5 Clear Cache</text>
            </g>
        </g>
    </g>

    <!-- Plugin Errors -->
    <g transform="translate(20,400)">
        <use href="#error-box"/>
        <text x="20" y="25" class="error-title">Plugin Errors</text>
        
        <!-- Error Area -->
        <g transform="translate(20,50)" class="error-box interactive-element">
            <use href="#solution-box"/>
            <text x="20" y="30" class="error-desc">Plugin Load Failed</text>
            <text x="20" y="50" class="error-desc" fill="#d32f2f">Error: Incompatible Version</text>
            
            <!-- Solution -->
            <g class="solution-detail">
                <rect x="10" y="70" width="300" height="100" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="20" y="90" class="solution-step">1. Check compatibility</text>
                <text x="20" y="110" class="solution-step">2. Update plugin</text>
                <text x="20" y="130" class="solution-step">3. Reinstall plugin</text>
                <text x="20" y="150" class="solution-step">4. Contact developer</text>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Plugin Troubleshooting</text>
                <text x="10" y="40" class="hover-text">• Version Check</text>
                <text x="10" y="60" class="hover-text">• Update Available</text>
                <text x="10" y="80" class="hover-text">• Safe Mode Available</text>
                <text x="10" y="100" class="hover-text">Ctrl+Alt+P Plugin Manager</text>
            </g>
        </g>
    </g>

    <!-- Prevention Tips -->
    <g transform="translate(20,700)">
        <rect width="1160" height="120" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
        <text x="20" y="30" class="error-title">Error Prevention Tips</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="error-desc">• Save work frequently (Ctrl+S)</text>
            <text x="0" y="20" class="error-desc">• Keep system updated</text>
            <text x="0" y="40" class="error-desc">• Monitor resource usage</text>
            
            <text x="300" y="0" class="error-desc">• Use auto-save feature</text>
            <text x="300" y="20" class="error-desc">• Check system requirements</text>
            <text x="300" y="40" class="error-desc">• Maintain free disk space</text>
            
            <text x="600" y="0" class="error-desc">• Regular maintenance</text>
            <text x="600" y="20" class="error-desc">• Backup important files</text>
            <text x="600" y="40" class="error-desc">• Keep plugins updated</text>
        </g>
    </g>

    <!-- Quick Recovery -->
    <g transform="translate(20,840)">
        <rect width="1160" height="120" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" class="error-title">Quick Recovery Steps</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="error-desc">• Press Esc to cancel operations</text>
            <text x="0" y="20" class="error-desc">• Ctrl+Alt+Z step back</text>
            <text x="0" y="40" class="error-desc">• Check auto-saved versions</text>
            
            <text x="300" y="0" class="error-desc">• Use diagnostic mode</text>
            <text x="300" y="20" class="error-desc">• Check error logs</text>
            <text x="300" y="40" class="error-desc">• Contact support</text>
            
            <text x="600" y="0" class="error-desc">• Safe mode startup</text>
            <text x="600" y="20" class="error-desc">• Reset preferences</text>
            <text x="600" y="40" class="error-desc">• System restore point</text>
        </g>
    </g>
</svg> 