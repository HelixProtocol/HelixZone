<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Tool Steps -->
    <!-- Select Tool -->
    <g transform="translate(50,50)">
        <rect width="120" height="60" rx="5" fill="#2196F3" opacity="0.9"/>
        <text x="60" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Select Tool
        </text>
    </g>
    
    <!-- Configure Options -->
    <g transform="translate(220,50)">
        <rect width="120" height="60" rx="5" fill="#4CAF50" opacity="0.9"/>
        <text x="60" y="27" text-anchor="middle" fill="white" font-family="Arial" font-size="14">
            Configure
        </text>
        <text x="60" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="14">
            Options
        </text>
    </g>
    
    <!-- Start Selection -->
    <g transform="translate(390,50)">
        <rect width="120" height="60" rx="5" fill="#FFC107" opacity="0.9"/>
        <text x="60" y="27" text-anchor="middle" fill="white" font-family="Arial" font-size="14">
            Click Start
        </text>
        <text x="60" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="14">
            Point
        </text>
    </g>
    
    <!-- Follow Edge -->
    <g transform="translate(560,50)">
        <rect width="120" height="60" rx="5" fill="#FF5722" opacity="0.9"/>
        <text x="60" y="27" text-anchor="middle" fill="white" font-family="Arial" font-size="14">
            Follow
        </text>
        <text x="60" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="14">
            Edge
        </text>
    </g>
    
    <!-- Options Panel -->
    <g transform="translate(220,160)">
        <rect width="120" height="140" rx="5" fill="#f5f5f5" stroke="#ccc"/>
        <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">
            Tool Options
        </text>
        <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="12">
            Edge Width: 10
        </text>
        <text x="60" y="80" text-anchor="middle" font-family="Arial" font-size="12">
            Contrast: 50
        </text>
        <text x="60" y="105" text-anchor="middle" font-family="Arial" font-size="12">
            Spacing: 20
        </text>
        <text x="60" y="130" text-anchor="middle" font-family="Arial" font-size="12">
            Feather: 2px
        </text>
    </g>
    
    <!-- Edge Detection -->
    <g transform="translate(560,160)">
        <rect width="120" height="140" rx="5" fill="#f5f5f5" stroke="#ccc"/>
        <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">
            Edge Detection
        </text>
        <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="12">
            1. Analyze Edge
        </text>
        <text x="60" y="80" text-anchor="middle" font-family="Arial" font-size="12">
            2. Find Path
        </text>
        <text x="60" y="105" text-anchor="middle" font-family="Arial" font-size="12">
            3. Place Points
        </text>
        <text x="60" y="130" text-anchor="middle" font-family="Arial" font-size="12">
            4. Update Path
        </text>
    </g>
    
    <!-- Arrows -->
    <path d="M 170,80 L 220,80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 340,80 L 390,80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 510,80 L 560,80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Options Connection -->
    <path d="M 280,110 L 280,160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Edge Detection Connection -->
    <path d="M 620,110 L 620,160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Arrow Marker -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
    
    <!-- Keyboard Shortcuts -->
    <g transform="translate(50,160)">
        <rect width="120" height="140" rx="5" fill="#f5f5f5" stroke="#ccc"/>
        <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">
            Shortcuts
        </text>
        <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="12">
            L: Select Tool
        </text>
        <text x="60" y="80" text-anchor="middle" font-family="Arial" font-size="12">
            [/]: Size
        </text>
        <text x="60" y="105" text-anchor="middle" font-family="Arial" font-size="12">
            Shift: Add
        </text>
        <text x="60" y="130" text-anchor="middle" font-family="Arial" font-size="12">
            Alt: Subtract
        </text>
    </g>
</svg> 