<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Workflow Steps -->
    <!-- Import and Setup -->
    <g transform="translate(50,50)">
        <rect width="150" height="60" rx="5" fill="#4CAF50" opacity="0.9"/>
        <text x="75" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Import Image
        </text>
    </g>
    
    <!-- Basic Adjustments -->
    <g transform="translate(50,150)">
        <rect width="150" height="80" rx="5" fill="#2196F3" opacity="0.9"/>
        <text x="75" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Basic Adjustments
        </text>
        <text x="75" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Brightness/Contrast
        </text>
        <text x="75" y="70" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Levels/Curves
        </text>
    </g>
    
    <!-- Selection -->
    <g transform="translate(250,150)">
        <rect width="150" height="80" rx="5" fill="#FFC107" opacity="0.9"/>
        <text x="75" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Selection
        </text>
        <text x="75" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Magnetic Lasso
        </text>
        <text x="75" y="70" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Feathering
        </text>
    </g>
    
    <!-- Local Adjustments -->
    <g transform="translate(450,150)">
        <rect width="150" height="80" rx="5" fill="#9C27B0" opacity="0.9"/>
        <text x="75" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Local Adjustments
        </text>
        <text x="75" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Dodge/Burn
        </text>
        <text x="75" y="70" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Color Balance
        </text>
    </g>
    
    <!-- Effects -->
    <g transform="translate(250,280)">
        <rect width="150" height="80" rx="5" fill="#FF5722" opacity="0.9"/>
        <text x="75" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Effects
        </text>
        <text x="75" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Filters
        </text>
        <text x="75" y="70" text-anchor="middle" fill="white" font-family="Arial" font-size="12">
            Blur/Sharpen
        </text>
    </g>
    
    <!-- Export -->
    <g transform="translate(250,410)">
        <rect width="150" height="60" rx="5" fill="#607D8B" opacity="0.9"/>
        <text x="75" y="35" text-anchor="middle" fill="white" font-family="Arial">
            Export
        </text>
    </g>
    
    <!-- Arrows -->
    <!-- Import to Basic -->
    <path d="M 125,110 L 125,150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Basic to Selection -->
    <path d="M 200,190 L 250,190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Selection to Local -->
    <path d="M 400,190 L 450,190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Local to Effects -->
    <path d="M 525,230 L 525,320 L 400,320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Effects to Export -->
    <path d="M 325,360 L 325,410" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Arrow Marker -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
    
    <!-- Legend -->
    <g transform="translate(600,50)">
        <rect width="150" height="120" rx="5" fill="#f5f5f5" stroke="#ccc"/>
        <text x="75" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">
            Legend
        </text>
        <circle cx="20" cy="50" r="6" fill="#4CAF50"/>
        <text x="35" y="55" font-family="Arial" font-size="12">Start</text>
        <circle cx="20" cy="70" r="6" fill="#FFC107"/>
        <text x="35" y="75" font-family="Arial" font-size="12">Selection</text>
        <circle cx="20" cy="90" r="6" fill="#9C27B0"/>
        <text x="35" y="95" font-family="Arial" font-size="12">Adjustments</text>
        <circle cx="20" cy="110" r="6" fill="#607D8B"/>
        <text x="35" y="115" font-family="Arial" font-size="12">Export</text>
    </g>
</svg> 