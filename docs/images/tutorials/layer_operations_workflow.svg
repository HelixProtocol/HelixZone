<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .step-title { font-family: Arial; font-size: 14px; font-weight: bold; }
            .step-desc { font-family: Arial; font-size: 12px; }
            .shortcut { font-family: 'Courier New'; font-size: 12px; fill: #2196F3; }
            .note { font-family: Arial; font-size: 12px; fill: #FF5722; }
        </style>
        
        <!-- Layer Preview -->
        <g id="layer-preview">
            <rect width="280" height="140" rx="3" fill="#fafafa" stroke="#e0e0e0"/>
            <rect width="280" height="30" rx="3" fill="#f5f5f5" stroke="#e0e0e0"/>
        </g>
        
        <!-- Layer Item -->
        <g id="layer-item">
            <rect width="260" height="30" rx="2" fill="#ffffff" stroke="#e0e0e0"/>
            <circle cx="20" cy="15" r="8" fill="#e0e0e0"/>
            <rect x="40" y="10" width="180" height="10" fill="#f5f5f5"/>
        </g>
    </defs>
    
    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Layer Operations Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Master layer management for non-destructive editing
    </text>
    
    <!-- Basic Layer Operations -->
    <g transform="translate(20,100)">
        <rect width="360" height="300" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
        <text x="20" y="30" class="step-title">Basic Layer Operations</text>
        
        <!-- Layer List Example -->
        <g transform="translate(20,50)">
            <use href="#layer-item"/>
            <text x="50" y="20" class="step-desc">Layer 1</text>
            <g transform="translate(0,35)">
                <use href="#layer-item"/>
                <text x="50" y="20" class="step-desc">Background</text>
            </g>
        </g>
        
        <!-- Operations List -->
        <g transform="translate(20,140)">
            <text x="0" y="0" class="step-desc">Create New Layer:</text>
            <text x="150" y="0" class="shortcut">Ctrl + Shift + N</text>
            
            <text x="0" y="25" class="step-desc">Duplicate Layer:</text>
            <text x="150" y="25" class="shortcut">Ctrl + J</text>
            
            <text x="0" y="50" class="step-desc">Delete Layer:</text>
            <text x="150" y="50" class="shortcut">Delete</text>
            
            <text x="0" y="75" class="step-desc">Merge Layers:</text>
            <text x="150" y="75" class="shortcut">Ctrl + E</text>
            
            <text x="0" y="100" class="step-desc">Group Layers:</text>
            <text x="150" y="100" class="shortcut">Ctrl + G</text>
            
            <text x="0" y="125" class="step-desc">Lock/Unlock:</text>
            <text x="150" y="125" class="shortcut">/ (forward slash)</text>
        </g>
    </g>
    
    <!-- Layer Blending -->
    <g transform="translate(400,100)">
        <rect width="360" height="300" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
        <text x="20" y="30" class="step-title">Layer Blending</text>
        
        <!-- Blend Modes Preview -->
        <g transform="translate(20,50)">
            <rect width="320" height="100" rx="3" fill="#fafafa" stroke="#e0e0e0"/>
            <text x="10" y="30" class="step-desc">Normal</text>
            <text x="80" y="30" class="step-desc">Multiply</text>
            <text x="150" y="30" class="step-desc">Screen</text>
            <text x="220" y="30" class="step-desc">Overlay</text>
            
            <text x="10" y="60" class="step-desc">Soft Light</text>
            <text x="80" y="60" class="step-desc">Hard Light</text>
            <text x="150" y="60" class="step-desc">Difference</text>
            <text x="220" y="60" class="step-desc">Exclusion</text>
        </g>
        
        <!-- Opacity Controls -->
        <g transform="translate(20,170)">
            <text x="0" y="0" class="step-desc">Adjust Opacity:</text>
            <text x="100" y="0" class="shortcut">Number Keys (0-9)</text>
            
            <text x="0" y="25" class="step-desc">Fill Opacity:</text>
            <text x="100" y="25" class="shortcut">Shift + Number Keys</text>
            
            <text x="0" y="50" class="step-desc">Toggle Visibility:</text>
            <text x="100" y="50" class="shortcut">Click Eye Icon</text>
        </g>
    </g>
    
    <!-- Layer Masks -->
    <g transform="translate(780,100)">
        <rect width="360" height="300" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
        <text x="20" y="30" class="step-title">Layer Masks</text>
        
        <!-- Mask Preview -->
        <g transform="translate(20,50)">
            <rect width="320" height="100" rx="3" fill="#fafafa" stroke="#e0e0e0"/>
            <text x="10" y="30" class="step-desc">White: Reveals</text>
            <text x="160" y="30" class="step-desc">Black: Hides</text>
            <text x="10" y="60" class="step-desc">Gray: Partial Transparency</text>
        </g>
        
        <!-- Mask Operations -->
        <g transform="translate(20,170)">
            <text x="0" y="0" class="step-desc">Add Mask:</text>
            <text x="100" y="0" class="shortcut">Layer Panel Icon</text>
            
            <text x="0" y="25" class="step-desc">Invert Mask:</text>
            <text x="100" y="25" class="shortcut">Ctrl + I</text>
            
            <text x="0" y="50" class="step-desc">Apply Mask:</text>
            <text x="100" y="50" class="shortcut">Right Click > Apply</text>
        </g>
    </g>
    
    <!-- Advanced Techniques -->
    <g transform="translate(20,420)">
        <rect width="1120" height="160" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
        <text x="20" y="30" class="step-title">Advanced Layer Techniques</text>
        
        <!-- Techniques List -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="step-desc">• Clipping Masks: Alt + Click between layers</text>
            <text x="0" y="25" class="step-desc">• Smart Objects: Right-click > Convert to Smart Object</text>
            <text x="0" y="50" class="step-desc">• Layer Styles: Double-click layer for effects</text>
            <text x="0" y="75" class="step-desc">• Layer Comps: Save layer states for different versions</text>
            
            <text x="400" y="0" class="step-desc">• Adjustment Layers: Non-destructive color/tone editing</text>
            <text x="400" y="25" class="step-desc">• Layer Groups: Organize and manage complex projects</text>
            <text x="400" y="50" class="step-desc">• Filter Layers: Apply effects non-destructively</text>
            <text x="400" y="75" class="step-desc">• Vector Layers: Resolution-independent shapes</text>
        </g>
    </g>
    
    <!-- Best Practices -->
    <g transform="translate(20,600)">
        <rect width="1120" height="180" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" class="step-title">Best Practices</text>
        
        <!-- Tips List -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="note">Organization:</text>
            <text x="0" y="20" class="step-desc">• Name layers descriptively</text>
            <text x="0" y="40" class="step-desc">• Use groups for related layers</text>
            <text x="0" y="60" class="step-desc">• Color-code layer categories</text>
            
            <text x="300" y="0" class="note">Efficiency:</text>
            <text x="300" y="20" class="step-desc">• Use adjustment layers</text>
            <text x="300" y="40" class="step-desc">• Utilize smart objects</text>
            <text x="300" y="60" class="step-desc">• Keep layer count manageable</text>
            
            <text x="600" y="0" class="note">Workflow:</text>
            <text x="600" y="20" class="step-desc">• Work non-destructively</text>
            <text x="600" y="40" class="step-desc">• Save versions regularly</text>
            <text x="600" y="60" class="step-desc">• Use layer comps for variations</text>
        </g>
    </g>
</svg> 