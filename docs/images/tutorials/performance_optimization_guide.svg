<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .section-title { font-family: Arial; font-size: 16px; font-weight: bold; }
            .category-title { font-family: Arial; font-size: 14px; font-weight: bold; }
            .metric-text { font-family: Arial; font-size: 12px; }
            .setting-text { font-family: Arial; font-size: 12px; fill: #1976d2; }
            .impact-high { font-family: Arial; font-size: 12px; fill: #2e7d32; }
            .impact-medium { font-family: Arial; font-size: 12px; fill: #f57c00; }
            .impact-low { font-family: Arial; font-size: 12px; fill: #d32f2f; }
        </style>

        <!-- Performance Meter -->
        <linearGradient id="performance-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#d32f2f"/>
            <stop offset="50%" style="stop-color:#f57c00"/>
            <stop offset="100%" style="stop-color:#2e7d32"/>
        </linearGradient>

        <!-- Setting Box -->
        <g id="setting-box">
            <rect width="360" height="80" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
        </g>

        <!-- Metric Box -->
        <g id="metric-box">
            <rect width="260" height="60" rx="5" fill="#f5f5f5" stroke="#e0e0e0"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Performance Optimization Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Maximize HelixZone performance with these optimized settings
    </text>

    <!-- GPU Optimization -->
    <g transform="translate(20,100)">
        <text class="section-title">GPU Acceleration</text>
        
        <!-- Settings -->
        <g transform="translate(0,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">CUDA Configuration</text>
            <text x="20" y="45" class="setting-text">cuda_memory_allocation: 75%</text>
            <text x="20" y="65" class="setting-text">cuda_cache_size: 2GB</text>
            <text x="280" y="45" class="impact-high">High Impact</text>
        </g>
        
        <!-- Metrics -->
        <g transform="translate(380,30)">
            <use href="#metric-box"/>
            <text x="20" y="25" class="metric-text">Expected Performance Gain:</text>
            <text x="20" y="45" class="impact-high">2-3x faster processing</text>
        </g>
    </g>

    <!-- Memory Management -->
    <g transform="translate(20,220)">
        <text class="section-title">Memory Optimization</text>
        
        <!-- RAM Settings -->
        <g transform="translate(0,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">RAM Allocation</text>
            <text x="20" y="45" class="setting-text">max_memory_usage: 70%</text>
            <text x="20" y="65" class="setting-text">cache_limit: 4GB</text>
            <text x="280" y="45" class="impact-high">High Impact</text>
        </g>
        
        <!-- Cache Settings -->
        <g transform="translate(380,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">Cache Management</text>
            <text x="20" y="45" class="setting-text">scratch_disk: SSD preferred</text>
            <text x="20" y="65" class="setting-text">auto_clear_cache: enabled</text>
            <text x="280" y="45" class="impact-medium">Medium Impact</text>
        </g>
    </g>

    <!-- Layer Optimization -->
    <g transform="translate(20,340)">
        <text class="section-title">Layer Management</text>
        
        <!-- Layer Settings -->
        <g transform="translate(0,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">Layer Settings</text>
            <text x="20" y="45" class="setting-text">max_layers: 100</text>
            <text x="20" y="65" class="setting-text">composite_quality: optimized</text>
            <text x="280" y="45" class="impact-medium">Medium Impact</text>
        </g>
        
        <!-- Thumbnail Settings -->
        <g transform="translate(380,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">Thumbnail Cache</text>
            <text x="20" y="45" class="setting-text">thumbnail_size: 256px</text>
            <text x="20" y="65" class="setting-text">cache_thumbnails: true</text>
            <text x="280" y="45" class="impact-low">Low Impact</text>
        </g>
    </g>

    <!-- File Handling -->
    <g transform="translate(20,460)">
        <text class="section-title">File Operations</text>
        
        <!-- Save Settings -->
        <g transform="translate(0,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">Save Settings</text>
            <text x="20" y="45" class="setting-text">auto_save: 10 minutes</text>
            <text x="20" y="65" class="setting-text">compression: optimized</text>
            <text x="280" y="45" class="impact-medium">Medium Impact</text>
        </g>
        
        <!-- Load Settings -->
        <g transform="translate(380,30)">
            <use href="#setting-box"/>
            <text x="20" y="25" class="category-title">Load Settings</text>
            <text x="20" y="45" class="setting-text">preview_quality: fast</text>
            <text x="20" y="65" class="setting-text">lazy_loading: enabled</text>
            <text x="280" y="45" class="impact-medium">Medium Impact</text>
        </g>
    </g>

    <!-- Performance Monitoring -->
    <g transform="translate(20,580)">
        <rect width="760" height="180" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
        <text x="20" y="30" class="section-title">Performance Monitoring</text>
        
        <!-- Metrics -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="category-title">Key Metrics to Monitor:</text>
            <text x="0" y="25" class="metric-text">• GPU Memory Usage (Target: <75%)</text>
            <text x="0" y="45" class="metric-text">• RAM Usage (Target: <70%)</text>
            <text x="0" y="65" class="metric-text">• Disk I/O (Target: <80% bandwidth)</text>
            <text x="0" y="85" class="metric-text">• Layer Count (Target: <100 active)</text>
            
            <text x="300" y="25" class="metric-text">• Cache Hit Rate (Target: >80%)</text>
            <text x="300" y="45" class="metric-text">• Render Time (Target: <100ms)</text>
            <text x="300" y="65" class="metric-text">• Response Time (Target: <50ms)</text>
            <text x="300" y="85" class="metric-text">• Save Time (Target: <5s)</text>
        </g>
    </g>

    <!-- Optimization Tips -->
    <g transform="translate(20,780)">
        <rect width="760" height="200" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" class="section-title">Optimization Tips</text>
        
        <!-- Tips List -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="category-title">General Tips:</text>
            <text x="0" y="25" class="metric-text">• Use adjustment layers instead of direct edits</text>
            <text x="0" y="45" class="metric-text">• Merge similar layers when possible</text>
            <text x="0" y="65" class="metric-text">• Clear undo history periodically</text>
            <text x="0" y="85" class="metric-text">• Use smart objects for complex effects</text>
            
            <text x="300" y="0" class="category-title">Hardware Recommendations:</text>
            <text x="300" y="25" class="metric-text">• SSD for scratch disk</text>
            <text x="300" y="45" class="metric-text">• 16GB+ RAM</text>
            <text x="300" y="65" class="metric-text">• CUDA-capable GPU (4GB+ VRAM)</text>
            <text x="300" y="85" class="metric-text">• Multi-core CPU (4+ cores)</text>
            
            <text x="0" y="120" class="category-title">Regular Maintenance:</text>
            <text x="0" y="140" class="metric-text">• Clear cache weekly</text>
            <text x="0" y="160" class="metric-text">• Update GPU drivers monthly</text>
            
            <text x="300" y="120" class="category-title">File Management:</text>
            <text x="300" y="140" class="metric-text">• Keep projects under 2GB</text>
            <text x="300" y="160" class="metric-text">• Use appropriate file formats</text>
        </g>
    </g>
</svg> 