<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .question { font-family: Arial; font-size: 14px; font-weight: bold; }
            .answer { font-family: Arial; font-size: 12px; }
            .solution { font-family: Arial; font-size: 12px; fill: #2e7d32; }
            .link-text { font-family: Arial; font-size: 11px; fill: #1976d2; }
        </style>

        <!-- Decision Node -->
        <g id="decision-node">
            <path d="M0,25 L50,0 L100,25 L50,50 Z" fill="#e3f2fd" stroke="#90caf9"/>
        </g>

        <!-- Answer Node -->
        <g id="answer-node">
            <rect width="180" height="60" rx="5" fill="#f1f8e9" stroke="#c5e1a5"/>
        </g>

        <!-- Arrow Marker -->
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#90caf9"/>
        </marker>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Interactive Troubleshooting Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Follow the flowchart to diagnose and solve common issues
    </text>

    <!-- Start Node -->
    <g transform="translate(550,100)">
        <circle r="30" fill="#e8f5e9" stroke="#81c784"/>
        <text x="0" y="5" text-anchor="middle" class="question">START</text>
    </g>

    <!-- First Level Questions -->
    <g transform="translate(400,200)">
        <!-- Application Launch Issues -->
        <g>
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                Application
                Launch Issue?
            </text>
        </g>
        
        <!-- Performance Issues -->
        <g transform="translate(200,0)">
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                Performance
                Issue?
            </text>
        </g>
        
        <!-- Tool/Feature Issues -->
        <g transform="translate(400,0)">
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                Tool/Feature
                Issue?
            </text>
        </g>
    </g>

    <!-- Second Level - Launch Issues -->
    <g transform="translate(300,300)">
        <!-- GPU Error -->
        <g>
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                GPU Error?
            </text>
        </g>
        
        <!-- OpenCV Error -->
        <g transform="translate(150,50)">
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                OpenCV Error?
            </text>
        </g>
    </g>

    <!-- Second Level - Performance Issues -->
    <g transform="translate(600,300)">
        <!-- Memory Issues -->
        <g>
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                Memory
                Issues?
            </text>
        </g>
        
        <!-- Slow Processing -->
        <g transform="translate(150,50)">
            <use href="#decision-node"/>
            <text x="50" y="30" text-anchor="middle" class="question">
                Slow
                Processing?
            </text>
        </g>
    </g>

    <!-- Solutions - Launch Issues -->
    <g transform="translate(200,400)">
        <!-- GPU Solution -->
        <g>
            <use href="#answer-node"/>
            <text x="10" y="20" class="solution">GPU Solution:</text>
            <text x="10" y="40" class="answer">1. Check drivers</text>
            <text x="10" y="55" class="answer">2. Verify CUDA toolkit</text>
        </g>
        
        <!-- OpenCV Solution -->
        <g transform="translate(200,0)">
            <use href="#answer-node"/>
            <text x="10" y="20" class="solution">OpenCV Solution:</text>
            <text x="10" y="40" class="answer">1. Reinstall package</text>
            <text x="10" y="55" class="answer">2. Check dependencies</text>
        </g>
    </g>

    <!-- Solutions - Performance Issues -->
    <g transform="translate(500,400)">
        <!-- Memory Solution -->
        <g>
            <use href="#answer-node"/>
            <text x="10" y="20" class="solution">Memory Solution:</text>
            <text x="10" y="40" class="answer">1. Clear cache</text>
            <text x="10" y="55" class="answer">2. Optimize layers</text>
        </g>
        
        <!-- Processing Solution -->
        <g transform="translate(200,0)">
            <use href="#answer-node"/>
            <text x="10" y="20" class="solution">Speed Solution:</text>
            <text x="10" y="40" class="answer">1. Enable GPU</text>
            <text x="10" y="55" class="answer">2. Optimize settings</text>
        </g>
    </g>

    <!-- Quick Links -->
    <g transform="translate(20,600)">
        <rect width="1160" height="120" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold">Quick Links</text>
        
        <!-- Links Grid -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="link-text">→ System Requirements Guide</text>
            <text x="0" y="25" class="link-text">→ GPU Compatibility List</text>
            <text x="0" y="50" class="link-text">→ Installation Guide</text>
            
            <text x="250" y="0" class="link-text">→ Performance Optimization</text>
            <text x="250" y="25" class="link-text">→ Memory Management</text>
            <text x="250" y="50" class="link-text">→ Troubleshooting FAQ</text>
            
            <text x="500" y="0" class="link-text">→ Error Recovery Guide</text>
            <text x="500" y="25" class="link-text">→ Support Contact</text>
            <text x="500" y="50" class="link-text">→ User Forums</text>
        </g>
    </g>

    <!-- Connection Lines -->
    <g fill="none" stroke="#90caf9" stroke-width="2" marker-end="url(#arrowhead)">
        <!-- Start to First Level -->
        <path d="M550,130 L550,170 L400,200"/>
        <path d="M550,130 L550,170 L600,200"/>
        <path d="M550,130 L550,170 L800,200"/>
        
        <!-- First to Second Level -->
        <path d="M400,250 L300,300"/>
        <path d="M400,250 L450,350"/>
        <path d="M600,250 L600,300"/>
        <path d="M600,250 L750,350"/>
        
        <!-- Second to Solution Level -->
        <path d="M300,350 L200,400"/>
        <path d="M450,350 L400,400"/>
        <path d="M600,350 L500,400"/>
        <path d="M750,350 L700,400"/>
    </g>

    <!-- Emergency Help -->
    <g transform="translate(20,750)">
        <rect width="1160" height="120" rx="5" fill="#ffebee" stroke="#ffcdd2"/>
        <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#d32f2f">
            Emergency Recovery
        </text>
        
        <!-- Emergency Steps -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="answer">1. Save all work if possible</text>
            <text x="0" y="25" class="answer">2. Take screenshot of error</text>
            <text x="0" y="50" class="answer">3. Contact support with details</text>
            
            <text x="250" y="0" class="answer">4. Check system logs</text>
            <text x="250" y="25" class="answer">5. Try safe mode launch</text>
            <text x="250" y="50" class="answer">6. Backup project files</text>
            
            <text x="500" y="0" class="answer">Support Email: support@helixzone.com</text>
            <text x="500" y="25" class="answer">Emergency Line: +1-XXX-XXX-XXXX</text>
            <text x="500" y="50" class="answer">Online Chat: helixzone.com/support</text>
        </g>
    </g>
</svg> 