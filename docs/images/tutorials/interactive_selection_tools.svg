<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .step-title { font-family: Arial; font-size: 14px; font-weight: bold; }
            .step-desc { font-family: Arial; font-size: 12px; }
            .shortcut { font-family: 'Courier New'; font-size: 12px; fill: #1976d2; }
            .hover-text { font-family: Arial; font-size: 12px; fill: #ffffff; }
            
            /* Interactive States */
            .interactive-element:hover {
                filter: brightness(1.1);
                cursor: pointer;
            }
            .tooltip { opacity: 0; transition: opacity 0.3s; }
            .interactive-element:hover .tooltip { opacity: 1; }
            .demo-area:hover .selection-preview { stroke-dasharray: 4 2; }
        </style>

        <!-- Tool Box -->
        <g id="tool-box">
            <rect width="320" height="200" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
            <rect width="320" height="40" rx="5" fill="#f5f5f5" stroke="#e0e0e0"/>
        </g>

        <!-- Demo Area -->
        <g id="demo-area">
            <rect width="280" height="140" rx="3" fill="#fafafa" stroke="#e0e0e0"/>
        </g>

        <!-- Tooltip -->
        <g id="tooltip">
            <rect width="200" height="100" rx="5" fill="#424242" opacity="0.9"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Interactive Selection Tools Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Hover over tools and demos to see them in action
    </text>

    <!-- Rectangular Selection -->
    <g transform="translate(20,100)">
        <use href="#tool-box"/>
        <text x="20" y="25" class="step-title">Rectangular Selection</text>
        
        <!-- Demo Area -->
        <g transform="translate(20,50)" class="demo-area interactive-element">
            <use href="#demo-area"/>
            <rect x="40" y="20" width="200" height="100" 
                  fill="none" stroke="#2196F3" stroke-width="2" 
                  class="selection-preview"/>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Rectangle Tool (M)</text>
                <text x="10" y="40" class="hover-text">• Click and drag</text>
                <text x="10" y="60" class="hover-text">• Hold Shift for square</text>
                <text x="10" y="80" class="hover-text">• Hold Alt for center out</text>
            </g>
        </g>
        
        <!-- Controls -->
        <g transform="translate(20,200)">
            <text x="0" y="0" class="shortcut">Shift</text>
            <text x="50" y="0" class="step-desc">Square selection</text>
            <text x="0" y="20" class="shortcut">Alt</text>
            <text x="50" y="20" class="step-desc">From center</text>
        </g>
    </g>

    <!-- Elliptical Selection -->
    <g transform="translate(360,100)">
        <use href="#tool-box"/>
        <text x="20" y="25" class="step-title">Elliptical Selection</text>
        
        <!-- Demo Area -->
        <g transform="translate(20,50)" class="demo-area interactive-element">
            <use href="#demo-area"/>
            <ellipse cx="140" cy="70" rx="100" ry="50" 
                     fill="none" stroke="#2196F3" stroke-width="2"
                     class="selection-preview"/>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Ellipse Tool (M)</text>
                <text x="10" y="40" class="hover-text">• Click and drag</text>
                <text x="10" y="60" class="hover-text">• Hold Shift for circle</text>
                <text x="10" y="80" class="hover-text">• Space to reposition</text>
            </g>
        </g>
        
        <!-- Controls -->
        <g transform="translate(20,200)">
            <text x="0" y="0" class="shortcut">Shift</text>
            <text x="50" y="0" class="step-desc">Perfect circle</text>
            <text x="0" y="20" class="shortcut">Space</text>
            <text x="50" y="20" class="step-desc">Move while drawing</text>
        </g>
    </g>

    <!-- Lasso Selection -->
    <g transform="translate(700,100)">
        <use href="#tool-box"/>
        <text x="20" y="25" class="step-title">Lasso Selection</text>
        
        <!-- Demo Area -->
        <g transform="translate(20,50)" class="demo-area interactive-element">
            <use href="#demo-area"/>
            <path d="M70,30 C100,20 150,25 200,60 C220,80 200,100 150,110 C100,120 50,100 70,30" 
                  fill="none" stroke="#2196F3" stroke-width="2"
                  class="selection-preview"/>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Lasso Tool (L)</text>
                <text x="10" y="40" class="hover-text">• Free-form drawing</text>
                <text x="10" y="60" class="hover-text">• Click points for straight</text>
                <text x="10" y="80" class="hover-text">• Alt to switch modes</text>
            </g>
        </g>
        
        <!-- Controls -->
        <g transform="translate(20,200)">
            <text x="0" y="0" class="shortcut">Click</text>
            <text x="50" y="0" class="step-desc">Add anchor points</text>
            <text x="0" y="20" class="shortcut">Alt</text>
            <text x="50" y="20" class="step-desc">Switch to polygonal</text>
        </g>
    </g>

    <!-- Magnetic Lasso -->
    <g transform="translate(20,320)">
        <use href="#tool-box"/>
        <text x="20" y="25" class="step-title">Magnetic Lasso</text>
        
        <!-- Demo Area -->
        <g transform="translate(20,50)" class="demo-area interactive-element">
            <use href="#demo-area"/>
            <path d="M70,30 Q100,20 150,25 T200,60 Q220,80 200,100 T150,110 Q100,120 70,30" 
                  fill="none" stroke="#2196F3" stroke-width="2"
                  class="selection-preview"/>
            <circle cx="150" cy="25" r="2" fill="#2196F3"/>
            <circle cx="200" cy="60" r="2" fill="#2196F3"/>
            <circle cx="150" cy="110" r="2" fill="#2196F3"/>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Magnetic Lasso (L)</text>
                <text x="10" y="40" class="hover-text">• Follows edges</text>
                <text x="10" y="60" class="hover-text">• Click to add points</text>
                <text x="10" y="80" class="hover-text">• Backspace to undo</text>
            </g>
        </g>
        
        <!-- Controls -->
        <g transform="translate(20,200)">
            <text x="0" y="0" class="shortcut">Width</text>
            <text x="50" y="0" class="step-desc">Edge detection range</text>
            <text x="0" y="20" class="shortcut">Contrast</text>
            <text x="50" y="20" class="step-desc">Edge sensitivity</text>
        </g>
    </g>

    <!-- Selection Modifiers -->
    <g transform="translate(360,320)">
        <use href="#tool-box"/>
        <text x="20" y="25" class="step-title">Selection Modifiers</text>
        
        <!-- Demo Area -->
        <g transform="translate(20,50)">
            <g class="interactive-element" transform="translate(0,0)">
                <rect width="80" height="30" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
                <text x="10" y="20" class="step-desc">Add</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(90,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Add to Selection</text>
                    <text x="10" y="40" class="hover-text">Hold Shift</text>
                    <text x="10" y="60" class="hover-text">Combines selections</text>
                </g>
            </g>
            
            <g class="interactive-element" transform="translate(100,0)">
                <rect width="80" height="30" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
                <text x="10" y="20" class="step-desc">Subtract</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(90,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Subtract from Selection</text>
                    <text x="10" y="40" class="hover-text">Hold Alt</text>
                    <text x="10" y="60" class="hover-text">Removes from selection</text>
                </g>
            </g>
            
            <g class="interactive-element" transform="translate(200,0)">
                <rect width="80" height="30" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
                <text x="10" y="20" class="step-desc">Intersect</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(90,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Intersect Selection</text>
                    <text x="10" y="40" class="hover-text">Hold Shift+Alt</text>
                    <text x="10" y="60" class="hover-text">Keeps overlapping area</text>
                </g>
            </g>
        </g>
        
        <!-- Controls -->
        <g transform="translate(20,200)">
            <text x="0" y="0" class="shortcut">Shift</text>
            <text x="50" y="0" class="step-desc">Add to selection</text>
            <text x="0" y="20" class="shortcut">Alt</text>
            <text x="50" y="20" class="step-desc">Subtract from selection</text>
        </g>
    </g>

    <!-- Quick Tips -->
    <g transform="translate(20,540)">
        <rect width="1160" height="120" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
        <text x="20" y="30" class="step-title">Quick Tips</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="step-desc">• Press Ctrl+D to deselect</text>
            <text x="0" y="20" class="step-desc">• Use feathering for soft edges</text>
            <text x="0" y="40" class="step-desc">• Right-click for context menu</text>
            
            <text x="300" y="0" class="step-desc">• Ctrl+Alt+R to refine edge</text>
            <text x="300" y="20" class="step-desc">• Space to reposition while drawing</text>
            <text x="300" y="40" class="step-desc">• Double-click to complete selection</text>
            
            <text x="600" y="0" class="step-desc">• Ctrl+Shift+I to invert selection</text>
            <text x="600" y="20" class="step-desc">• Use [ ] to adjust brush size</text>
            <text x="600" y="40" class="step-desc">• Hold Shift for straight lines</text>
        </g>
    </g>

    <!-- Best Practices -->
    <g transform="translate(20,680)">
        <rect width="1160" height="120" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" class="step-title">Best Practices</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="step-desc">• Zoom in for precise selections</text>
            <text x="0" y="20" class="step-desc">• Use appropriate tool for subject</text>
            <text x="0" y="40" class="step-desc">• Start with larger selections first</text>
            
            <text x="300" y="0" class="step-desc">• Adjust feathering before selecting</text>
            <text x="300" y="20" class="step-desc">• Save complex selections</text>
            <text x="300" y="40" class="step-desc">• Use Quick Mask for fine-tuning</text>
            
            <text x="600" y="0" class="step-desc">• Combine tools for best results</text>
            <text x="600" y="20" class="step-desc">• Review at different zoom levels</text>
            <text x="600" y="40" class="step-desc">• Consider using paths for precision</text>
        </g>
    </g>
</svg> 