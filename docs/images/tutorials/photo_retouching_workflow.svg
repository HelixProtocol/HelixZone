<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .step-title { font-family: Arial; font-size: 14px; font-weight: bold; }
            .step-desc { font-family: Arial; font-size: 12px; }
            .tool-name { font-family: Arial; font-size: 12px; fill: #2196F3; }
            .tip { font-family: Arial; font-size: 12px; fill: #4CAF50; }
        </style>
        
        <!-- Step Container -->
        <g id="step-box">
            <rect width="360" height="240" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
            <rect width="360" height="40" rx="5" fill="#f5f5f5" stroke="#e0e0e0"/>
        </g>
        
        <!-- Image Preview -->
        <g id="image-preview">
            <rect width="320" height="160" rx="3" fill="#fafafa" stroke="#e0e0e0"/>
            <text x="160" y="80" text-anchor="middle" class="step-desc">[Image Preview]</text>
        </g>
        
        <!-- Arrow -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2196F3"/>
        </marker>
    </defs>
    
    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Photo Retouching Workflow
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Professional photo enhancement in 5 easy steps
    </text>
    
    <!-- Step 1: Basic Adjustments -->
    <g transform="translate(20,100)">
        <use href="#step-box"/>
        <text x="20" y="25" class="step-title">1. Basic Adjustments</text>
        <use href="#image-preview" x="20" y="50"/>
        
        <!-- Instructions -->
        <g transform="translate(20,220)">
            <text x="0" y="0" class="step-desc">1. Crop and straighten image</text>
            <text x="200" y="0" class="tool-name">C</text>
            <text x="0" y="20" class="step-desc">2. Adjust exposure and contrast</text>
            <text x="200" y="20" class="tool-name">Levels (Ctrl+L)</text>
            <text x="0" y="40" class="step-desc">3. Fine-tune white balance</text>
            <text x="200" y="40" class="tool-name">Color Balance</text>
        </g>
    </g>
    
    <!-- Step 2: Clean Up -->
    <g transform="translate(420,100)">
        <use href="#step-box"/>
        <text x="20" y="25" class="step-title">2. Clean Up</text>
        <use href="#image-preview" x="20" y="50"/>
        
        <!-- Instructions -->
        <g transform="translate(20,220)">
            <text x="0" y="0" class="step-desc">1. Remove blemishes</text>
            <text x="200" y="0" class="tool-name">Spot Healing (J)</text>
            <text x="0" y="20" class="step-desc">2. Fix imperfections</text>
            <text x="200" y="20" class="tool-name">Clone Stamp (S)</text>
            <text x="0" y="40" class="step-desc">3. Reduce noise</text>
            <text x="200" y="40" class="tool-name">Filter > Noise</text>
        </g>
    </g>
    
    <!-- Step 3: Color Enhancement -->
    <g transform="translate(820,100)">
        <use href="#step-box"/>
        <text x="20" y="25" class="step-title">3. Color Enhancement</text>
        <use href="#image-preview" x="20" y="50"/>
        
        <!-- Instructions -->
        <g transform="translate(20,220)">
            <text x="0" y="0" class="step-desc">1. Adjust vibrance/saturation</text>
            <text x="200" y="0" class="tool-name">Hue/Sat (Ctrl+U)</text>
            <text x="0" y="20" class="step-desc">2. Enhance specific colors</text>
            <text x="200" y="20" class="tool-name">Selective Color</text>
            <text x="0" y="40" class="step-desc">3. Apply color grading</text>
            <text x="200" y="40" class="tool-name">Color Balance</text>
        </g>
    </g>
    
    <!-- Step 4: Local Adjustments -->
    <g transform="translate(20,380)">
        <use href="#step-box"/>
        <text x="20" y="25" class="step-title">4. Local Adjustments</text>
        <use href="#image-preview" x="20" y="50"/>
        
        <!-- Instructions -->
        <g transform="translate(20,220)">
            <text x="0" y="0" class="step-desc">1. Dodge and burn</text>
            <text x="200" y="0" class="tool-name">D/B Tools</text>
            <text x="0" y="20" class="step-desc">2. Sharpen details</text>
            <text x="200" y="20" class="tool-name">Smart Sharpen</text>
            <text x="0" y="40" class="step-desc">3. Adjust local contrast</text>
            <text x="200" y="40" class="tool-name">Clarity</text>
        </g>
    </g>
    
    <!-- Step 5: Final Touches -->
    <g transform="translate(420,380)">
        <use href="#step-box"/>
        <text x="20" y="25" class="step-title">5. Final Touches</text>
        <use href="#image-preview" x="20" y="50"/>
        
        <!-- Instructions -->
        <g transform="translate(20,220)">
            <text x="0" y="0" class="step-desc">1. Add vignette</text>
            <text x="200" y="0" class="tool-name">Effects > Vignette</text>
            <text x="0" y="20" class="step-desc">2. Final color grade</text>
            <text x="200" y="20" class="tool-name">LUT/Curves</text>
            <text x="0" y="40" class="step-desc">3. Export for intended use</text>
            <text x="200" y="40" class="tool-name">File > Export</text>
        </g>
    </g>
    
    <!-- Best Practices -->
    <g transform="translate(820,380)">
        <rect width="360" height="240" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
        <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold">Best Practices</text>
        
        <!-- Tips -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="tip">• Work on duplicate layers</text>
            <text x="0" y="25" class="tip">• Use adjustment layers</text>
            <text x="0" y="50" class="tip">• Save versions frequently</text>
            <text x="0" y="75" class="tip">• Keep original file untouched</text>
            <text x="0" y="100" class="tip">• Use masks for local edits</text>
            <text x="0" y="125" class="tip">• Check results at 100% zoom</text>
        </g>
    </g>
    
    <!-- Quick Reference -->
    <g transform="translate(20,660)">
        <rect width="1160" height="200" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold">Quick Reference</text>
        
        <!-- Shortcuts -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="step-desc">Essential Shortcuts:</text>
            <text x="0" y="25" class="tool-name">Ctrl + L</text>
            <text x="80" y="25" class="step-desc">Levels</text>
            <text x="0" y="50" class="tool-name">Ctrl + M</text>
            <text x="80" y="50" class="step-desc">Curves</text>
            <text x="0" y="75" class="tool-name">Ctrl + U</text>
            <text x="80" y="75" class="step-desc">Hue/Saturation</text>
        </g>
        
        <!-- Tool Tips -->
        <g transform="translate(250,50)">
            <text x="0" y="0" class="step-desc">Tool Tips:</text>
            <text x="0" y="25" class="step-desc">• [ ] : Adjust brush size</text>
            <text x="0" y="50" class="step-desc">• Alt + Click : Sample color</text>
            <text x="0" y="75" class="step-desc">• Shift + Tool : Straight lines</text>
        </g>
        
        <!-- Layer Tips -->
        <g transform="translate(500,50)">
            <text x="0" y="0" class="step-desc">Layer Tips:</text>
            <text x="0" y="25" class="step-desc">• Alt + Layer : Create copy</text>
            <text x="0" y="50" class="step-desc">• Ctrl + J : Duplicate layer</text>
            <text x="0" y="75" class="step-desc">• Ctrl + G : Group layers</text>
        </g>
        
        <!-- Export Tips -->
        <g transform="translate(750,50)">
            <text x="0" y="0" class="step-desc">Export Tips:</text>
            <text x="0" y="25" class="step-desc">• Web: JPG/PNG, sRGB</text>
            <text x="0" y="50" class="step-desc">• Print: TIFF, 300dpi</text>
            <text x="0" y="75" class="step-desc">• Archive: PSD with layers</text>
        </g>
    </g>
</svg> 