<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .step-title { font-family: Arial; font-size: 14px; font-weight: bold; }
            .step-desc { font-family: Arial; font-size: 12px; }
            .shortcut { font-family: 'Courier New'; font-size: 12px; fill: #1976d2; }
            .hover-text { font-family: Arial; font-size: 12px; fill: #ffffff; }
            
            /* Interactive States */
            .interactive-element:hover {
                filter: brightness(1.1);
                cursor: pointer;
            }
            .tooltip { opacity: 0; transition: opacity 0.3s; }
            .interactive-element:hover .tooltip { opacity: 1; }
        </style>

        <!-- Interactive Layer Item -->
        <g id="layer-item">
            <rect width="280" height="40" rx="3" fill="#ffffff" stroke="#e0e0e0" class="interactive-element"/>
            <circle cx="20" cy="20" r="8" fill="#e0e0e0"/>
            <rect x="40" y="12" width="200" height="16" fill="#f5f5f5"/>
        </g>

        <!-- Tooltip -->
        <g id="tooltip">
            <rect width="200" height="80" rx="5" fill="#424242" opacity="0.9"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Interactive Layer Operations
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Click on elements to see detailed information and shortcuts
    </text>

    <!-- Layer Panel -->
    <g transform="translate(20,100)">
        <!-- Panel Header -->
        <rect width="300" height="40" rx="5" fill="#f5f5f5" stroke="#e0e0e0"/>
        <text x="20" y="25" class="step-title">Layers</text>

        <!-- Layer List -->
        <g transform="translate(0,50)" class="interactive-element">
            <use href="#layer-item"/>
            <text x="50" y="25" class="step-desc">Adjustment Layer</text>
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Adjustment Layer</text>
                <text x="10" y="40" class="hover-text">Non-destructive editing</text>
                <text x="10" y="60" class="hover-text">Shortcut: Ctrl+Alt+N</text>
            </g>
        </g>

        <g transform="translate(0,100)" class="interactive-element">
            <use href="#layer-item"/>
            <text x="50" y="25" class="step-desc">Layer 1</text>
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Regular Layer</text>
                <text x="10" y="40" class="hover-text">Direct editing</text>
                <text x="10" y="60" class="hover-text">Shortcut: Ctrl+Shift+N</text>
            </g>
        </g>

        <g transform="translate(0,150)" class="interactive-element">
            <use href="#layer-item"/>
            <text x="50" y="25" class="step-desc">Background</text>
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(290,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Background Layer</text>
                <text x="10" y="40" class="hover-text">Base layer</text>
                <text x="10" y="60" class="hover-text">Double-click to unlock</text>
            </g>
        </g>
    </g>

    <!-- Layer Operations -->
    <g transform="translate(340,100)">
        <!-- Operations Panel -->
        <rect width="300" height="200" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
        <text x="20" y="30" class="step-title">Common Operations</text>

        <!-- Operation Buttons -->
        <g transform="translate(20,50)">
            <g class="interactive-element">
                <rect width="260" height="30" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
                <text x="10" y="20" class="step-desc">New Layer</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(270,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Create New Layer</text>
                    <text x="10" y="40" class="hover-text">Shortcut: Ctrl+Shift+N</text>
                    <text x="10" y="60" class="hover-text">Click for options</text>
                </g>
            </g>

            <g transform="translate(0,40)" class="interactive-element">
                <rect width="260" height="30" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
                <text x="10" y="20" class="step-desc">Duplicate Layer</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(270,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Duplicate Layer</text>
                    <text x="10" y="40" class="hover-text">Shortcut: Ctrl+J</text>
                    <text x="10" y="60" class="hover-text">Alt+Drag to duplicate</text>
                </g>
            </g>

            <g transform="translate(0,80)" class="interactive-element">
                <rect width="260" height="30" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
                <text x="10" y="20" class="step-desc">Merge Layers</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(270,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Merge Layers</text>
                    <text x="10" y="40" class="hover-text">Shortcut: Ctrl+E</text>
                    <text x="10" y="60" class="hover-text">Select layers first</text>
                </g>
            </g>
        </g>
    </g>

    <!-- Layer Properties -->
    <g transform="translate(660,100)">
        <!-- Properties Panel -->
        <rect width="300" height="400" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
        <text x="20" y="30" class="step-title">Layer Properties</text>

        <!-- Property Groups -->
        <g transform="translate(20,50)">
            <!-- Blend Mode -->
            <g class="interactive-element">
                <rect width="260" height="60" rx="3" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="10" y="20" class="step-desc">Blend Mode</text>
                <text x="10" y="40" class="shortcut">Normal ▼</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(270,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Blend Mode</text>
                    <text x="10" y="40" class="hover-text">Changes layer interaction</text>
                    <text x="10" y="60" class="hover-text">Shift++ or Shift+- to cycle</text>
                </g>
            </g>

            <!-- Opacity -->
            <g transform="translate(0,70)" class="interactive-element">
                <rect width="260" height="60" rx="3" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="10" y="20" class="step-desc">Opacity</text>
                <text x="10" y="40" class="shortcut">100% ▼</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(270,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Layer Opacity</text>
                    <text x="10" y="40" class="hover-text">Number keys 0-9</text>
                    <text x="10" y="60" class="hover-text">for 0-90% opacity</text>
                </g>
            </g>

            <!-- Effects -->
            <g transform="translate(0,140)" class="interactive-element">
                <rect width="260" height="60" rx="3" fill="#f5f5f5" stroke="#e0e0e0"/>
                <text x="10" y="20" class="step-desc">Effects</text>
                <text x="10" y="40" class="shortcut">fx ▼</text>
                <!-- Tooltip -->
                <g class="tooltip" transform="translate(270,0)">
                    <use href="#tooltip"/>
                    <text x="10" y="20" class="hover-text">Layer Effects</text>
                    <text x="10" y="40" class="hover-text">Double-click layer</text>
                    <text x="10" y="60" class="hover-text">for effects panel</text>
                </g>
            </g>
        </g>
    </g>

    <!-- Quick Tips -->
    <g transform="translate(20,400)">
        <rect width="940" height="120" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
        <text x="20" y="30" class="step-title">Quick Tips</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="step-desc">• Hold Shift to select multiple layers</text>
            <text x="0" y="20" class="step-desc">• Alt + Click layer mask to view/edit</text>
            <text x="0" y="40" class="step-desc">• Ctrl + Click thumbnail to load selection</text>
            
            <text x="300" y="0" class="step-desc">• Right-click for context menu</text>
            <text x="300" y="20" class="step-desc">• Drag to reorder layers</text>
            <text x="300" y="40" class="step-desc">• Double-click for layer options</text>
            
            <text x="600" y="0" class="step-desc">• Use groups for organization</text>
            <text x="600" y="20" class="step-desc">• Lock layers to prevent changes</text>
            <text x="600" y="40" class="step-desc">• Use adjustment layers for non-destructive edits</text>
        </g>
    </g>

    <!-- Interactive Elements Legend -->
    <g transform="translate(20,540)">
        <rect width="940" height="80" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" class="step-title">Interactive Elements</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="step-desc">• Hover over elements to see more information</text>
            <text x="300" y="0" class="step-desc">• Click buttons to perform actions</text>
            <text x="600" y="0" class="step-desc">• Use keyboard shortcuts for quick access</text>
        </g>
    </g>
</svg> 