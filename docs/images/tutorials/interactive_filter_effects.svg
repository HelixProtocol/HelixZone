<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .filter-title { font-family: Arial; font-size: 16px; font-weight: bold; }
            .filter-desc { font-family: Arial; font-size: 12px; }
            .param-name { font-family: 'Courier New'; font-size: 12px; fill: #1976d2; }
            .hover-text { font-family: Arial; font-size: 12px; fill: #ffffff; }
            
            /* Interactive States */
            .interactive-element:hover {
                filter: brightness(1.1);
                cursor: pointer;
            }
            .tooltip { opacity: 0; transition: opacity 0.3s; }
            .interactive-element:hover .tooltip { opacity: 1; }
            .preview-after { opacity: 0; transition: opacity 0.3s; }
            .preview-area:hover .preview-after { opacity: 1; }
        </style>

        <!-- Filter Container -->
        <g id="filter-container">
            <rect width="360" height="320" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
            <rect width="360" height="40" rx="5" fill="#f5f5f5" stroke="#e0e0e0"/>
        </g>

        <!-- Preview Area -->
        <g id="preview-area">
            <rect width="320" height="180" rx="3" fill="#fafafa" stroke="#e0e0e0"/>
        </g>

        <!-- Parameter Slider -->
        <g id="param-slider">
            <rect width="200" height="20" rx="3" fill="#e0e0e0"/>
            <circle r="8" fill="#1976d2"/>
        </g>

        <!-- Tooltip -->
        <g id="tooltip">
            <rect width="200" height="120" rx="5" fill="#424242" opacity="0.9"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Interactive Filter Effects Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Hover over filters to see before/after previews and parameter controls
    </text>

    <!-- Artistic Filters -->
    <g transform="translate(20,100)">
        <use href="#filter-container"/>
        <text x="20" y="25" class="filter-title">Artistic Filters</text>
        
        <!-- Preview Area -->
        <g transform="translate(20,50)" class="preview-area interactive-element">
            <use href="#preview-area"/>
            <rect x="10" y="10" width="300" height="160" fill="#e0e0e0"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc">Original</text>
            <rect x="10" y="10" width="300" height="160" fill="#bbdefb" class="preview-after"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc preview-after">Oil Paint</text>
            
            <!-- Parameters -->
            <g transform="translate(20,200)">
                <text x="0" y="0" class="param-name">Brush Size:</text>
                <use href="#param-slider" transform="translate(80,0)"/>
                <text x="0" y="30" class="param-name">Detail:</text>
                <use href="#param-slider" transform="translate(80,30)"/>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Oil Paint Filter</text>
                <text x="10" y="40" class="hover-text">• Adjusts brush strokes</text>
                <text x="10" y="60" class="hover-text">• Controls detail level</text>
                <text x="10" y="80" class="hover-text">• Artistic effect</text>
                <text x="10" y="100" class="hover-text">Shortcut: Ctrl+Shift+A</text>
            </g>
        </g>
    </g>

    <!-- Blur Filters -->
    <g transform="translate(400,100)">
        <use href="#filter-container"/>
        <text x="20" y="25" class="filter-title">Blur Filters</text>
        
        <!-- Preview Area -->
        <g transform="translate(20,50)" class="preview-area interactive-element">
            <use href="#preview-area"/>
            <rect x="10" y="10" width="300" height="160" fill="#e0e0e0"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc">Original</text>
            <rect x="10" y="10" width="300" height="160" fill="#e1bee7" class="preview-after"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc preview-after">Gaussian Blur</text>
            
            <!-- Parameters -->
            <g transform="translate(20,200)">
                <text x="0" y="0" class="param-name">Radius:</text>
                <use href="#param-slider" transform="translate(80,0)"/>
                <text x="0" y="30" class="param-name">Quality:</text>
                <use href="#param-slider" transform="translate(80,30)"/>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Gaussian Blur</text>
                <text x="10" y="40" class="hover-text">• Smooth blur effect</text>
                <text x="10" y="60" class="hover-text">• Adjustable radius</text>
                <text x="10" y="80" class="hover-text">• Quality control</text>
                <text x="10" y="100" class="hover-text">Shortcut: Ctrl+Shift+B</text>
            </g>
        </g>
    </g>

    <!-- Sharpen Filters -->
    <g transform="translate(780,100)">
        <use href="#filter-container"/>
        <text x="20" y="25" class="filter-title">Sharpen Filters</text>
        
        <!-- Preview Area -->
        <g transform="translate(20,50)" class="preview-area interactive-element">
            <use href="#preview-area"/>
            <rect x="10" y="10" width="300" height="160" fill="#e0e0e0"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc">Original</text>
            <rect x="10" y="10" width="300" height="160" fill="#c8e6c9" class="preview-after"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc preview-after">Smart Sharpen</text>
            
            <!-- Parameters -->
            <g transform="translate(20,200)">
                <text x="0" y="0" class="param-name">Amount:</text>
                <use href="#param-slider" transform="translate(80,0)"/>
                <text x="0" y="30" class="param-name">Threshold:</text>
                <use href="#param-slider" transform="translate(80,30)"/>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Smart Sharpen</text>
                <text x="10" y="40" class="hover-text">• Edge detection</text>
                <text x="10" y="60" class="hover-text">• Noise reduction</text>
                <text x="10" y="80" class="hover-text">• Selective sharpening</text>
                <text x="10" y="100" class="hover-text">Shortcut: Ctrl+Shift+S</text>
            </g>
        </g>
    </g>

    <!-- Special Effects -->
    <g transform="translate(20,440)">
        <use href="#filter-container"/>
        <text x="20" y="25" class="filter-title">Special Effects</text>
        
        <!-- Preview Area -->
        <g transform="translate(20,50)" class="preview-area interactive-element">
            <use href="#preview-area"/>
            <rect x="10" y="10" width="300" height="160" fill="#e0e0e0"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc">Original</text>
            <rect x="10" y="10" width="300" height="160" fill="#ffccbc" class="preview-after"/>
            <text x="160" y="90" text-anchor="middle" class="filter-desc preview-after">Glitch Effect</text>
            
            <!-- Parameters -->
            <g transform="translate(20,200)">
                <text x="0" y="0" class="param-name">Intensity:</text>
                <use href="#param-slider" transform="translate(80,0)"/>
                <text x="0" y="30" class="param-name">Randomize:</text>
                <use href="#param-slider" transform="translate(80,30)"/>
            </g>
            
            <!-- Tooltip -->
            <g class="tooltip" transform="translate(330,0)">
                <use href="#tooltip"/>
                <text x="10" y="20" class="hover-text">Glitch Effect</text>
                <text x="10" y="40" class="hover-text">• RGB shift</text>
                <text x="10" y="60" class="hover-text">• Scanlines</text>
                <text x="10" y="80" class="hover-text">• Random noise</text>
                <text x="10" y="100" class="hover-text">Shortcut: Ctrl+Shift+G</text>
            </g>
        </g>
    </g>

    <!-- Best Practices -->
    <g transform="translate(20,780)">
        <rect width="1160" height="100" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
        <text x="20" y="30" class="filter-title">Best Practices</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="filter-desc">• Apply filters on duplicate layers</text>
            <text x="0" y="20" class="filter-desc">• Use layer masks for selective application</text>
            
            <text x="300" y="0" class="filter-desc">• Preview at 100% zoom</text>
            <text x="300" y="20" class="filter-desc">• Adjust opacity for subtle effects</text>
            
            <text x="600" y="0" class="filter-desc">• Stack filters carefully</text>
            <text x="600" y="20" class="filter-desc">• Consider performance impact</text>
        </g>
    </g>

    <!-- Quick Tips -->
    <g transform="translate(20,900)">
        <rect width="1160" height="80" rx="5" fill="#fff3e0" stroke="#ffe0b2"/>
        <text x="20" y="30" class="filter-title">Quick Tips</text>
        
        <g transform="translate(20,50)">
            <text x="0" y="0" class="filter-desc">• Alt+Click to reset parameters</text>
            <text x="300" y="0" class="filter-desc">• Ctrl+F to repeat last filter</text>
            <text x="600" y="0" class="filter-desc">• Shift+Click for precise adjustments</text>
        </g>
    </g>
</svg> 