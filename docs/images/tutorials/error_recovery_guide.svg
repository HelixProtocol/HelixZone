<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Common Styles -->
        <style type="text/css">
            .section-title { font-family: Arial; font-size: 16px; font-weight: bold; }
            .error-title { font-family: Arial; font-size: 14px; font-weight: bold; fill: #d32f2f; }
            .solution-title { font-family: Arial; font-size: 14px; font-weight: bold; fill: #2e7d32; }
            .desc-text { font-family: Arial; font-size: 12px; }
            .code-text { font-family: 'Courier New'; font-size: 12px; fill: #1976d2; }
            .warning-text { font-family: Arial; font-size: 12px; fill: #ed6c02; }
        </style>

        <!-- Error Box Template -->
        <g id="error-box">
            <rect width="360" height="280" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
            <rect width="360" height="40" rx="5" fill="#ffebee" stroke="#e0e0e0"/>
        </g>

        <!-- Solution Box Template -->
        <g id="solution-box">
            <rect width="360" height="120" rx="5" fill="#f1f8e9" stroke="#c5e1a5"/>
        </g>

        <!-- Code Box Template -->
        <g id="code-box">
            <rect width="320" height="60" rx="3" fill="#f5f5f5" stroke="#e0e0e0"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold">
        Error Recovery Guide
    </text>
    <text x="20" y="70" font-family="Arial" font-size="14">
        Solutions for common issues and troubleshooting steps
    </text>

    <!-- GPU Errors Section -->
    <g transform="translate(20,100)">
        <text class="section-title">GPU-Related Issues</text>
        
        <!-- CUDA Error -->
        <g transform="translate(0,30)">
            <use href="#error-box"/>
            <text x="20" y="25" class="error-title">CUDA Initialization Failed</text>
            
            <!-- Error Description -->
            <g transform="translate(20,50)">
                <use href="#code-box"/>
                <text x="10" y="20" class="code-text">RuntimeError: CUDA initialization failed</text>
                <text x="10" y="40" class="code-text">No CUDA-capable device detected</text>
            </g>
            
            <!-- Solution -->
            <g transform="translate(20,120)">
                <use href="#solution-box"/>
                <text x="10" y="20" class="solution-title">Solution:</text>
                <text x="10" y="40" class="desc-text">1. Verify NVIDIA GPU is present and drivers are installed</text>
                <text x="10" y="60" class="desc-text">2. Check CUDA toolkit version compatibility</text>
                <text x="10" y="80" class="desc-text">3. Update GPU drivers to latest version</text>
                <text x="10" y="100" class="desc-text">4. Ensure no other application is blocking CUDA</text>
            </g>
            
            <!-- Prevention -->
            <text x="20" y="260" class="warning-text">Prevention: Run system compatibility check before installation</text>
        </g>
    </g>

    <!-- OpenCV Errors Section -->
    <g transform="translate(400,100)">
        <text class="section-title">OpenCV Issues</text>
        
        <!-- Import Error -->
        <g transform="translate(0,30)">
            <use href="#error-box"/>
            <text x="20" y="25" class="error-title">OpenCV Import Error</text>
            
            <!-- Error Description -->
            <g transform="translate(20,50)">
                <use href="#code-box"/>
                <text x="10" y="20" class="code-text">ImportError: No module named cv2</text>
                <text x="10" y="40" class="code-text">DLL load failed: Module not found</text>
            </g>
            
            <!-- Solution -->
            <g transform="translate(20,120)">
                <use href="#solution-box"/>
                <text x="10" y="20" class="solution-title">Solution:</text>
                <text x="10" y="40" class="desc-text">1. Reinstall OpenCV: pip install opencv-python</text>
                <text x="10" y="60" class="desc-text">2. Install OpenCV contrib packages if needed</text>
                <text x="10" y="80" class="desc-text">3. Check Python environment path</text>
                <text x="10" y="100" class="desc-text">4. Verify Visual C++ redistributable is installed</text>
            </g>
            
            <!-- Prevention -->
            <text x="20" y="260" class="warning-text">Prevention: Use virtual environment and requirements.txt</text>
        </g>
    </g>

    <!-- Memory Errors Section -->
    <g transform="translate(780,100)">
        <text class="section-title">Memory Issues</text>
        
        <!-- Out of Memory -->
        <g transform="translate(0,30)">
            <use href="#error-box"/>
            <text x="20" y="25" class="error-title">Out of Memory Error</text>
            
            <!-- Error Description -->
            <g transform="translate(20,50)">
                <use href="#code-box"/>
                <text x="10" y="20" class="code-text">MemoryError: Unable to allocate array</text>
                <text x="10" y="40" class="code-text">CUDA out of memory</text>
            </g>
            
            <!-- Solution -->
            <g transform="translate(20,120)">
                <use href="#solution-box"/>
                <text x="10" y="20" class="solution-title">Solution:</text>
                <text x="10" y="40" class="desc-text">1. Reduce image size or batch processing</text>
                <text x="10" y="60" class="desc-text">2. Clear unused layers and history</text>
                <text x="10" y="80" class="desc-text">3. Enable disk caching for large files</text>
                <text x="10" y="100" class="desc-text">4. Close other memory-intensive applications</text>
            </g>
            
            <!-- Prevention -->
            <text x="20" y="260" class="warning-text">Prevention: Monitor memory usage and optimize workflow</text>
        </g>
    </g>

    <!-- Performance Issues Section -->
    <g transform="translate(20,420)">
        <text class="section-title">Performance Issues</text>
        
        <!-- Slow Processing -->
        <g transform="translate(0,30)">
            <use href="#error-box"/>
            <text x="20" y="25" class="error-title">Slow Processing Speed</text>
            
            <!-- Error Description -->
            <g transform="translate(20,50)">
                <use href="#code-box"/>
                <text x="10" y="20" class="desc-text">• Laggy interface response</text>
                <text x="10" y="40" class="desc-text">• Slow filter application</text>
            </g>
            
            <!-- Solution -->
            <g transform="translate(20,120)">
                <use href="#solution-box"/>
                <text x="10" y="20" class="solution-title">Solution:</text>
                <text x="10" y="40" class="desc-text">1. Enable GPU acceleration in preferences</text>
                <text x="10" y="60" class="desc-text">2. Increase cache size and scratch disk space</text>
                <text x="10" y="80" class="desc-text">3. Optimize image resolution for editing</text>
                <text x="10" y="100" class="desc-text">4. Use smart objects for complex operations</text>
            </g>
            
            <!-- Prevention -->
            <text x="20" y="260" class="warning-text">Prevention: Regular maintenance and optimization checks</text>
        </g>
    </g>

    <!-- File Errors Section -->
    <g transform="translate(400,420)">
        <text class="section-title">File Issues</text>
        
        <!-- Save/Load Errors -->
        <g transform="translate(0,30)">
            <use href="#error-box"/>
            <text x="20" y="25" class="error-title">File Save/Load Errors</text>
            
            <!-- Error Description -->
            <g transform="translate(20,50)">
                <use href="#code-box"/>
                <text x="10" y="20" class="desc-text">• Unable to save file</text>
                <text x="10" y="40" class="desc-text">• Corrupted file on load</text>
            </g>
            
            <!-- Solution -->
            <g transform="translate(20,120)">
                <use href="#solution-box"/>
                <text x="10" y="20" class="solution-title">Solution:</text>
                <text x="10" y="40" class="desc-text">1. Check disk space and permissions</text>
                <text x="10" y="60" class="desc-text">2. Use auto-save and recovery options</text>
                <text x="10" y="80" class="desc-text">3. Save in different format/location</text>
                <text x="10" y="100" class="desc-text">4. Verify file integrity after saving</text>
            </g>
            
            <!-- Prevention -->
            <text x="20" y="260" class="warning-text">Prevention: Regular backups and version control</text>
        </g>
    </g>

    <!-- Quick Recovery Steps -->
    <g transform="translate(20,740)">
        <rect width="1160" height="220" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
        <text x="20" y="30" class="section-title">Quick Recovery Steps</text>
        
        <!-- General Steps -->
        <g transform="translate(20,50)">
            <text x="0" y="0" class="solution-title">1. Check System Requirements</text>
            <text x="0" y="20" class="desc-text">• Minimum: 8GB RAM, CUDA-capable GPU</text>
            <text x="0" y="40" class="desc-text">• Recommended: 16GB RAM, 4GB VRAM</text>
            
            <text x="400" y="0" class="solution-title">2. Verify Software Environment</text>
            <text x="400" y="20" class="desc-text">• Python 3.8+ with required packages</text>
            <text x="400" y="40" class="desc-text">• Latest GPU drivers and CUDA toolkit</text>
            
            <text x="800" y="0" class="solution-title">3. Optimize Settings</text>
            <text x="800" y="20" class="desc-text">• Adjust cache and memory settings</text>
            <text x="800" y="40" class="desc-text">• Configure performance preferences</text>
        </g>
        
        <!-- Emergency Recovery -->
        <g transform="translate(20,120)">
            <text x="0" y="0" class="error-title">Emergency Recovery Steps:</text>
            <text x="0" y="25" class="desc-text">1. Save work immediately if possible</text>
            <text x="0" y="50" class="desc-text">2. Clear application cache and restart</text>
            <text x="0" y="75" class="desc-text">3. Check log files for error details</text>
            
            <text x="400" y="25" class="desc-text">4. Restore from auto-save if needed</text>
            <text x="400" y="50" class="desc-text">5. Contact support with error logs</text>
            <text x="400" y="75" class="desc-text">6. Use safe mode for critical issues</text>
        </g>
    </g>
</svg> 