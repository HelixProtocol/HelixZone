<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for common elements -->
    <defs>
        <!-- Icon Background -->
        <rect id="icon-bg" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc"/>
        
        <!-- Tool Highlight -->
        <rect id="tool-highlight" width="32" height="32" rx="4" fill="#2196F3" opacity="0.1"/>
        
        <!-- Common Gradients -->
        <linearGradient id="tool-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1"/>
        </linearGradient>
    </defs>
    
    <!-- Selection Tools Group -->
    <g transform="translate(20,20)">
        <!-- Rectangle Selection -->
        <g id="rectangle-selection">
            <use href="#icon-bg"/>
            <rect x="8" y="8" width="16" height="16" fill="none" 
                  stroke="url(#tool-gradient)" stroke-width="2" stroke-dasharray="4 2"/>
        </g>
        
        <!-- Ellipse Selection (40px spacing) -->
        <g transform="translate(40,0)">
            <use href="#icon-bg"/>
            <circle cx="16" cy="16" r="8" fill="none" 
                    stroke="url(#tool-gradient)" stroke-width="2" stroke-dasharray="4 2"/>
        </g>
        
        <!-- Lasso Selection -->
        <g transform="translate(80,0)">
            <use href="#icon-bg"/>
            <path d="M10,10 C14,8 18,8 22,10 C26,12 26,16 24,20 C22,24 18,24 14,22 L10,10" 
                  fill="none" stroke="url(#tool-gradient)" stroke-width="2"/>
        </g>
        
        <!-- Magnetic Lasso -->
        <g transform="translate(120,0)">
            <use href="#icon-bg"/>
            <path d="M10,10 C14,8 18,8 22,10 C26,12 26,16 24,20 C22,24 18,24 14,22 L10,10" 
                  fill="none" stroke="url(#tool-gradient)" stroke-width="2"/>
            <circle cx="10" cy="10" r="2" fill="#FF5722"/>
            <circle cx="22" cy="10" r="2" fill="#FF5722"/>
            <circle cx="24" cy="20" r="2" fill="#FF5722"/>
            <circle cx="14" cy="22" r="2" fill="#FF5722"/>
        </g>
    </g>
    
    <!-- Paint Tools Group -->
    <g transform="translate(20,80)">
        <!-- Brush -->
        <g id="brush">
            <use href="#icon-bg"/>
            <path d="M8,24 L16,16 L24,8 M20,12 L12,20" 
                  stroke="url(#tool-gradient)" stroke-width="3" stroke-linecap="round"/>
        </g>
        
        <!-- Eraser -->
        <g transform="translate(40,0)">
            <use href="#icon-bg"/>
            <rect x="10" y="10" width="12" height="12" 
                  transform="rotate(45,16,16)" fill="url(#tool-gradient)"/>
        </g>
        
        <!-- Gradient -->
        <g transform="translate(80,0)">
            <use href="#icon-bg"/>
            <defs>
                <linearGradient id="gradient-tool" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#000;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#fff;stop-opacity:1"/>
                </linearGradient>
            </defs>
            <rect x="8" y="8" width="16" height="16" fill="url(#gradient-tool)"/>
        </g>
        
        <!-- Eyedropper -->
        <g transform="translate(120,0)">
            <use href="#icon-bg"/>
            <path d="M12,20 L8,24 L12,28 L16,24 L12,20 M12,20 L20,12 L24,8" 
                  stroke="url(#tool-gradient)" stroke-width="2" fill="none"/>
            <circle cx="24" cy="8" r="2" fill="#FF5722"/>
        </g>
    </g>
    
    <!-- Adjustment Tools Group -->
    <g transform="translate(20,140)">
        <!-- Levels -->
        <g id="levels">
            <use href="#icon-bg"/>
            <path d="M8,24 L24,8 M8,16 L24,16 M8,8 L24,24" 
                  stroke="url(#tool-gradient)" stroke-width="2"/>
        </g>
        
        <!-- Curves -->
        <g transform="translate(40,0)">
            <use href="#icon-bg"/>
            <path d="M8,24 C12,24 20,8 24,8" 
                  stroke="url(#tool-gradient)" stroke-width="2" fill="none"/>
        </g>
        
        <!-- Brightness/Contrast -->
        <g transform="translate(80,0)">
            <use href="#icon-bg"/>
            <circle cx="16" cy="16" r="8" fill="url(#tool-gradient)" opacity="0.5"/>
            <path d="M16,8 L16,24 M8,16 L24,16" 
                  stroke="url(#tool-gradient)" stroke-width="2"/>
        </g>
        
        <!-- Color Balance -->
        <g transform="translate(120,0)">
            <use href="#icon-bg"/>
            <circle cx="13" cy="16" r="6" fill="#FF5722" opacity="0.5"/>
            <circle cx="19" cy="16" r="6" fill="#2196F3" opacity="0.5"/>
        </g>
    </g>
    
    <!-- View Tools Group -->
    <g transform="translate(20,200)">
        <!-- Zoom -->
        <g id="zoom">
            <use href="#icon-bg"/>
            <circle cx="14" cy="14" r="6" stroke="url(#tool-gradient)" 
                    stroke-width="2" fill="none"/>
            <path d="M19,19 L24,24" stroke="url(#tool-gradient)" 
                  stroke-width="2" stroke-linecap="round"/>
            <path d="M14,11 L14,17 M11,14 L17,14" stroke="url(#tool-gradient)" 
                  stroke-width="2"/>
        </g>
        
        <!-- Hand (Pan) -->
        <g transform="translate(40,0)">
            <use href="#icon-bg"/>
            <path d="M16,8 C14,8 12,10 12,12 L12,20 C12,22 14,24 16,24 C18,24 20,22 20,20 L20,12 C20,10 18,8 16,8" 
                  stroke="url(#tool-gradient)" stroke-width="2" fill="none"/>
        </g>
        
        <!-- Rotate -->
        <g transform="translate(80,0)">
            <use href="#icon-bg"/>
            <path d="M16,8 A8,8 0 1,1 16,24" stroke="url(#tool-gradient)" 
                  stroke-width="2" fill="none"/>
            <path d="M16,8 L20,12 L12,12" fill="url(#tool-gradient)"/>
        </g>
        
        <!-- Ruler -->
        <g transform="translate(120,0)">
            <use href="#icon-bg"/>
            <rect x="8" y="12" width="16" height="8" fill="url(#tool-gradient)"/>
            <path d="M8,16 L24,16 M12,12 L12,20 M16,12 L16,20 M20,12 L20,20" 
                  stroke="white" stroke-width="1"/>
        </g>
    </g>
</svg> 