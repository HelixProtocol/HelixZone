<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
    <!-- Include main interface -->
    <use href="main-interface-layout.svg" transform="translate(100,100)"/>
    
    <!-- Annotation Styles -->
    <defs>
        <!-- Arrow Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5722"/>
        </marker>
        
        <!-- Annotation Box -->
        <filter id="annotation-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
            <feOffset dx="0" dy="1" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Annotations -->
    <!-- Menu Bar -->
    <g class="annotation" transform="translate(20,50)">
        <path d="M 120,70 L 200,20" stroke="#FF5722" stroke-width="2" 
              marker-end="url(#arrow)" fill="none"/>
        <rect x="200" y="0" width="200" height="40" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="210" y="25" font-family="Arial" font-size="12">
            Menu Bar: Access all commands and features
        </text>
    </g>
    
    <!-- Tool Bar -->
    <g class="annotation" transform="translate(20,200)">
        <path d="M 40,130 L 20,130" stroke="#FF5722" stroke-width="2" 
              marker-end="url(#arrow)" fill="none"/>
        <rect x="20" y="150" width="180" height="40" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="30" y="175" font-family="Arial" font-size="12">
            Tool Bar: Quick access to tools
        </text>
    </g>
    
    <!-- Canvas Area -->
    <g class="annotation" transform="translate(500,50)">
        <path d="M 500,400 L 600,350" stroke="#FF5722" stroke-width="2" 
              marker-end="url(#arrow)" fill="none"/>
        <rect x="600" y="330" width="200" height="40" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="610" y="355" font-family="Arial" font-size="12">
            Canvas: Main editing area
        </text>
    </g>
    
    <!-- Layers Panel -->
    <g class="annotation" transform="translate(1060,150)">
        <path d="M 240,100 L 300,100" stroke="#FF5722" stroke-width="2" 
              marker-end="url(#arrow)" fill="none"/>
        <rect x="300" y="80" width="200" height="40" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="310" y="105" font-family="Arial" font-size="12">
            Layers Panel: Manage image layers
        </text>
    </g>
    
    <!-- Properties Panel -->
    <g class="annotation" transform="translate(1060,500)">
        <path d="M 240,100 L 300,100" stroke="#FF5722" stroke-width="2" 
              marker-end="url(#arrow)" fill="none"/>
        <rect x="300" y="80" width="200" height="40" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="310" y="105" font-family="Arial" font-size="12">
            Properties: Tool-specific options
        </text>
    </g>
    
    <!-- Status Bar -->
    <g class="annotation" transform="translate(20,880)">
        <path d="M 100,0 L 100,-50" stroke="#FF5722" stroke-width="2" 
              marker-end="url(#arrow)" fill="none"/>
        <rect x="20" y="-90" width="200" height="40" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="30" y="-65" font-family="Arial" font-size="12">
            Status Bar: Information and progress
        </text>
    </g>
    
    <!-- Key Features -->
    <g class="annotation" transform="translate(1060,300)">
        <rect x="0" y="0" width="250" height="150" rx="5" fill="#ffffff" 
              filter="url(#annotation-shadow)"/>
        <text x="10" y="25" font-family="Arial" font-size="14" font-weight="bold">
            Key Features:
        </text>
        <text x="20" y="50" font-family="Arial" font-size="12">
            • Dockable panels for customization
        </text>
        <text x="20" y="75" font-family="Arial" font-size="12">
            • Tool-specific property panels
        </text>
        <text x="20" y="100" font-family="Arial" font-size="12">
            • Layer-based editing
        </text>
        <text x="20" y="125" font-family="Arial" font-size="12">
            • Non-destructive editing
        </text>
    </g>
</svg> 